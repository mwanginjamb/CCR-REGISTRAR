<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#001A48">
    <title>Offline · KEMRI Cancer Registry</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <!-- Self-contained: shown by the service worker when a page is not available offline -->
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f2f4f6; color: #191c1e; padding: 24px; box-sizing: border-box;
        }
        .card {
            max-width: 420px; width: 100%; background: #fff; border-radius: 16px; padding: 32px;
            box-shadow: 0 12px 32px rgba(0, 26, 72, 0.08); text-align: center;
        }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.35rem; color: #001a48; margin: 16px 0 8px; }
        p { color: #444651; line-height: 1.5; margin: 0 0 20px; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        a, button {
            display: block; padding: 12px 16px; border-radius: 10px; font-weight: 700; font-size: 0.95rem;
            text-decoration: none; cursor: pointer; border: 0;
        }
        .primary { background: #001a48; color: #fff; }
        .secondary { background: #e6e8ea; color: #001a48; }
        .note { font-size: 0.8rem; color: #747782; margin-top: 18px; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icons/icon-192.png" alt="KEMRI">
        <h1>You're offline</h1>
        <p>This page isn't available without a connection. You can still register a new case: it is saved on this device and uploads automatically when you're back online.</p>
        <div class="actions">
            <a class="primary" href="/patient/create">Register a new case offline</a>
            <button class="secondary" type="button" onclick="location.reload()">Try again</button>
        </div>
        <p class="note">Saved cases stay on this device until they upload.</p>
    </main>
</body>
</html>
